# Builds Tempo.exe and publishes a GitHub release whenever a version tag (v1.2.3) is pushed.
# Installed copies of Tempo find the new release and update themselves.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish Tempo.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$version -o out
          $hash = (Get-FileHash out/Tempo.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content out/Tempo.exe.sha256 "$hash  Tempo.exe" -NoNewline

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/Tempo.exe out/Tempo.exe.sha256 `
            --title "Tempo ${{ github.ref_name }}" --notes-from-tag
